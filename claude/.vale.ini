StylesPath = styles
MinAlertLevel = suggestion

# voice-lint always hands Vale a .md file, so this one section covers
# files, stdin, and commit messages alike.
[*.md]
BasedOnStyles = Voice
# Voice.PRFirstPerson applies only to PR descriptions; voice-lint filters it
# out with --filter unless it was given --pr.

# voice.md quotes every banned phrase in order to state the rules, so linting
# it against those rules is pure false positive.
[voice.md]
Voice.Announcements = NO
Voice.Distance = NO
Voice.EmDash = NO
Voice.FillerFrames = NO
Voice.Fragments = NO
Voice.Frames = NO
Voice.Grain = NO
Voice.HumanVerbs = NO
Voice.NarratingDoc = NO
Voice.NegationPivots = NO
Voice.ParticipialTrailer = NO
Voice.Paths = NO
Voice.RhetoricalSetups = NO
Voice.SelfRating = NO
Voice.Vocabulary = NO
Voice.VocabularyBare = NO
Voice.PRFirstPerson = NO

