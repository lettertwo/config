theme = "laserwave-nvim"
mode = "auto"
line_numbers = true
wrap_lines = false
hunk_headers = false
menu_bar = false
agent_notes = true
copy_decorations = false
cursor_line = "row"
animations = "false"

[keybindings]
"hunk.view.toggleFilesPane" = "o"
# stack binds tab to focus its outline; the built-in focus toggle would take it first.
"hunk.app.toggleFocusArea" = false

"hunk.review.nextFile" = "]"
"hunk.review.previousFile" = "["
"hunk.review.nextHunk" = "}"
"hunk.review.previousHunk" = "{"
"hunk.review.pageDown" = ["pagedown", "f", "space"]
"hunk.review.pageUp" = ["pageup", "b"]
"hunk.review.halfPageDown" = ["d", "ctrl+d", "J"]
"hunk.review.halfPageUp" = ["u", "ctrl+u", "K"]
"hunk.review.nextAnnotatedFile" = ">"
"hunk.review.previousAnnotatedFile" = "<"
"hunk.review.scrollCodeLeft" = ["h", "left", "H", "shift+left"]
"hunk.review.scrollCodeRight" = ["l", "right", "L", "shift+right"]

# stack writes notes in its own editor, which makes notes it can move; Hunk's built-ins would take these first.
"hunk.review.startNote" = false
"hunk.review.replyToActiveNote" = false
"hunk.review.editActiveNote" = false
"hunk-stack.note-add" = "c"
"hunk-stack.note-reply" = "R"
"hunk-stack.note-edit" = "E"

# stack runs the motions that can land on a note card, so it knows which card a reply or edit is for.
"hunk.review.stepDown" = false
"hunk.review.stepUp" = false
"hunk.review.nextNote" = false
"hunk.review.previousNote" = false
"hunk-stack.step-down" = ["j", "down"]
"hunk-stack.step-up" = ["k", "up"]
"hunk-stack.next-note" = "."
"hunk-stack.previous-note" = ","

"hunk-stack.next-unread" = false
"hunk-stack.toggle-hidden" = "ctrl+space"

[extension.hunk-stack]
width = 0.3
